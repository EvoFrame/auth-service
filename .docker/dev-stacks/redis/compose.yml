# Note:  this compose file is meant to be used in the context of the whole project,
# and not as a standalone file.
# It is included in the main compose file at the root of the project.

services:
  redis:
    image: redis:7-alpine
    profiles:
      - services
      - dev-stack
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - redis_net
      - evoframe-internal
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    profiles:
      - ui
    container_name: ${COMPOSE_PROJECT_NAME}-redisinsight
    ports:
      - "127.0.0.1:${REDIS_UI_PORT:-5540}:5540"
    environment:
      RI_REDIS_HOST:     redis
      RI_REDIS_PORT:     6379
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
    # No volume — ephemeral by design
    networks:
      - redis_net
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:latest
    profiles:
      - monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-redis-exporter
    environment:
      REDIS_ADDR:     "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # No volume — ephemeral by design
    networks:
      - redis_net
      - evoframe-internal
    restart: unless-stopped

volumes:
  redis_data:

networks:
  redis_net:
    name: ${COMPOSE_PROJECT_NAME}_redis