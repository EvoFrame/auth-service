# Note: this compose file is meant to be used in the context of the whole project,
# and not as a standalone file.
# It is included in the main compose file at the root of the project.

services:
  loki:
    image: grafana/loki:3.1.0
    profiles:
      - monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../../monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    profiles:
      - monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../../monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring_net
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles:
      - monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring_net
      - evoframe-internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles:
      - monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER:        ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:    ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED:     "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE:    Admin
      GF_AUTH_DISABLE_LOGIN_FORM:    "false"
      GF_AUTH_BASIC_ENABLED:         "true"
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring_net:
    name: ${COMPOSE_PROJECT_NAME}_monitoring
  evoframe-internal:
    name: evoframe-internal
    external: true
