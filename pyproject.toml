[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication and authorization service for EvoFrame"
authors = [
    { name = "Cyboooooorg", email = "" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt[crypto]>=2.8",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "authlib>=1.3",
    "cryptography>=42.0",
    "greenlet>=3.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["resources/tests"]
pythonpath = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff]
line-length = 120
