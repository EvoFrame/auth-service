version: "3"

tasks:
  _guard:
    internal: true
    preconditions:
      - sh: test -n "$DEVBOX_SHELL_ENABLED"
        msg: "Not in devbox shell. Run: devbox shell  or  direnv allow"

  migrate:
    desc: Apply pending Alembic migrations
    deps: [_guard]
    cmd: uv run alembic -c resources/alembic.ini upgrade head

  new:
    desc: Generate a new migration (name=<name>)
    deps: [_guard]
    cmd: uv run alembic -c resources/alembic.ini revision --autogenerate -m "{{.name}}"

  rollback:
    desc: Rollback one migration step
    deps: [_guard]
    cmd: uv run alembic -c resources/alembic.ini downgrade -1

  history:
    desc: Show full migration history
    deps: [_guard]
    cmd: uv run alembic -c resources/alembic.ini history --verbose
